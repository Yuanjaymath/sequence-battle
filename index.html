  <style>
    :root{
      color-scheme:light;
      --ink:#17324d;--muted:#63768a;--panel:rgba(255,255,255,.95);--line:#dbe7f2;
      --accent:#1268d5;--accent-dark:#0c4da3;--good:#16805f;--bad:#b6293c;--soft:#eef7ff;
      --tech:#07172f;--tech2:#123a68;--cyan:#53ddff;--violet:#8f7cff;--shadow:0 18px 50px rgba(21,58,93,.14);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;

    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 12% 8%,rgba(96,211,255,.42),transparent 26rem),radial-gradient(circle at 88% 14%,rgba(152,255,192,.38),transparent 28rem),linear-gradient(145deg,#eaf7ff 0%,#f7fff9 52%,#fffaf0 100%)}
    button,input{font:inherit}button{min-height:48px;border:0;border-radius:14px;cursor:pointer;touch-action:manipulation;transition:transform .15s ease,opacity .15s ease,box-shadow .15s ease}button:disabled{cursor:wait;opacity:.55}button:not(:disabled):active{transform:translateY(1px) scale(.99)}button:focus-visible,input:focus-visible{outline:4px solid rgba(18,104,213,.22);outline-offset:2px}
    .app-shell{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:28px 0 52px}.brand{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand-title{display:flex;align-items:center;gap:12px;min-width:0}.brand-mark{display:grid;place-items:center;width:52px;height:52px;flex:0 0 52px;border-radius:18px;font-size:28px;background:white;box-shadow:var(--shadow)}h1,h2,p{margin-top:0}h1{margin-bottom:2px;font-size:clamp(1.35rem,3vw,2rem);line-height:1.1}.brand small{color:var(--muted)}
    .designer-credit{position:fixed;top:10px;right:12px;z-index:150;padding:7px 11px;border:1px solid rgba(83,221,255,.38);border-radius:999px;background:rgba(6,23,52,.88);color:#dffaff;font-size:.78rem;font-weight:850;letter-spacing:.03em;backdrop-filter:blur(8px);box-shadow:0 0 18px rgba(83,221,255,.14)}
    .connection-pill{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:7px 12px;margin-right:135px;border-radius:999px;background:rgba(255,255,255,.78);border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-size:.9rem}.connection-dot{width:9px;height:9px;border-radius:50%;background:#8fa2b6}.connection-pill[data-tone="good"] .connection-dot{background:var(--good);box-shadow:0 0 0 5px rgba(22,128,95,.12)}.connection-pill[data-tone="bad"] .connection-dot{background:var(--bad);box-shadow:0 0 0 5px rgba(182,41,60,.1)}
    .screen{display:none;background:var(--panel);border:1px solid rgba(204,220,234,.88);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}.screen.active{display:block}.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(240px,.8fr);gap:28px;align-items:center;padding:clamp(26px,5vw,54px)}.eyebrow{display:inline-flex;align-items:center;gap:8px;margin-bottom:12px;padding:7px 11px;border-radius:999px;background:#e6f4ff;color:#15518b;font-weight:750;font-size:.9rem}.welcome-buddy{display:inline-flex;align-items:center;gap:10px;margin-bottom:12px;padding:8px 12px;border-radius:18px;background:#e6f4ff;color:#15518b;font-weight:850}.welcome-animal{font-size:2rem;line-height:1}.welcome-phrase{font-size:.95rem}.hero h2,.panel-heading h2{font-size:clamp(1.7rem,5vw,3.1rem);line-height:1.08;margin-bottom:12px}.hero p,.panel-heading p{color:var(--muted);line-height:1.75}.login-card{padding:22px;border-radius:22px;border:1px solid var(--line);background:#fff}.field-label{display:block;font-weight:800;margin-bottom:8px}.text-input{width:100%;min-height:52px;padding:12px 14px;border:1px solid #bfcfdd;border-radius:14px;color:var(--ink);background:#fbfdff;font-size:1rem}.field-help{margin:7px 0 16px;color:var(--muted);font-size:.86rem}.primary-btn{width:100%;padding:12px 18px;color:white;background:linear-gradient(135deg,var(--accent),var(--accent-dark));box-shadow:0 10px 24px rgba(18,104,213,.22);font-weight:850}.secondary-btn{padding:10px 16px;border:1px solid var(--line);color:var(--ink);background:white;font-weight:750}.danger-outline{border-color:#e1a8b0;color:#9f2637;background:#fff8f9}.stage-actions{display:flex;justify-content:center;gap:10px;margin-top:20px}.create-btn{padding:11px 18px;color:#fff;background:linear-gradient(135deg,#16805f,#0f6e70);font-weight:850;box-shadow:0 9px 22px rgba(22,128,95,.17)}
    .lobby-wrap{padding:clamp(22px,4vw,38px)}.lobby-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}.identity strong{display:block;font-size:1.18rem}.identity span{color:var(--muted);font-size:.9rem}.toolbar-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.panel-heading{margin-bottom:18px}.panel-heading h2{font-size:clamp(1.65rem,4vw,2.45rem)}.rooms-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.room-card{display:flex;flex-direction:column;gap:15px;min-width:0;padding:18px;border:1px solid var(--line);border-radius:20px;background:#fff}.room-card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.room-host{min-width:0}.room-host strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1.12rem}.room-host small{color:var(--muted)}.player-count{flex:0 0 auto;padding:7px 10px;border-radius:999px;background:var(--soft);color:#285776;font-weight:850}.join-btn{width:100%;padding:11px 14px;color:var(--accent-dark);background:#eaf4ff;border:1px solid #c9e1fa;font-weight:850}.empty-state{grid-column:1/-1;padding:40px 20px;text-align:center;border:1px dashed #bfd1df;border-radius:20px;background:#fbfdff;color:var(--muted)}.empty-state .emoji{display:block;margin-bottom:8px;font-size:2.2rem}
    .center-stage{display:grid;place-items:center;min-height:430px;padding:34px 22px;text-align:center}.stage-card{width:min(650px,100%)}.stage-icon{font-size:clamp(3.2rem,10vw,5.5rem);margin-bottom:12px}.stage-card h2{font-size:clamp(1.8rem,5vw,2.8rem);margin-bottom:10px}.stage-card p{color:var(--muted);line-height:1.7}.waiting-name{display:inline-block;margin-top:8px;padding:9px 14px;border-radius:999px;background:#edf8ff;font-weight:850}.versus{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px;margin:24px 0}.fighter{min-width:0;padding:18px 12px;border:1px solid var(--line);border-radius:20px;background:#fff;font-size:clamp(1.15rem,4vw,1.7rem);font-weight:900;overflow-wrap:anywhere}.vs-badge{font-weight:950;color:var(--bad);font-size:1.35rem}.success-badge{display:inline-block;padding:10px 16px;border-radius:999px;color:#0b6748;background:#ddf7ec;font-weight:900}.message-bar{min-height:22px;margin:14px 4px 0;color:var(--muted);text-align:center;font-size:.92rem}.message-bar[data-tone="bad"]{color:var(--bad);font-weight:700}.message-bar[data-tone="good"]{color:var(--good);font-weight:700}
